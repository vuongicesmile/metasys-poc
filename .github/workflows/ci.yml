name: Validate source
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Backend and release-planner tests
        shell: pwsh
        run: |
          dotnet test tests/MetasysPoc.Tests/MetasysPoc.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts/tests -p test_release.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Dashboard and web-resource regression
        shell: pwsh
        run: |
          npm --prefix dataverse/app-source/fmc-bms-demo ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix dataverse/app-source/fmc-bms-demo test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test scripts/tests/Test-BmsEventDemoLanguage.mjs scripts/tests/Test-EquipmentPluginTest.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
