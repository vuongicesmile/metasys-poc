dding:24px;color:#63758c;text-align:center}footer{font-size:12px;color:#63758c;margin-top:16px}#back{margin-top:18px}.evidence-card{padding:0;overflow:hidden;border-color:#cad9ef}.evidence-head{display:flex;gap:14px;align-items:flex-start;padding:22px;background:linear-gradient(135deg,#eef5ff,#f8fbff);border-bottom:1px solid #dce7f5}.evidence-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#205fce;color:white;font-size:20px;flex:0 0 auto}.evidence-head p{margin:6px 0 0}.evidence-body{padding:22px}.filter-grid{display:grid;grid-template-columns:minmax(220px,2fr) minmax(170px,1fr) minmax(170px,1fr) auto;gap:12px;align-items:end}.field-label{display:flex;flex-direction:column;gap:6px;color:#415a77;font-size:12px;font-weight:600}.field-label input{width:100%;height:40px;border:1px solid #bfd0e4;border-radius:9px;padding:8px 11px;background:white;color:#182941}.field-label input:focus{outline:3px solid #dceaff;border-color:#3978d3}.search-button{height:40px;white-space:nowrap}.selected-reading{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin:0 0 18px;padding:14px 16px;border:1px solid #9dc5a9;border-radius:11px;background:#f0faf3}.selected-reading strong{display:block;color:#1f6235}.selected-reading p{margin:5px 0 0}.reading-value{font-size:16px;font-weight:700;color:#173d6c;white-space:nowrap}.reading-results{margin-top:14px;border:1px solid #e1e8f1;border-radius:11px;overflow:auto}.reading-results table{min-width:720px}.reading-results td:first-child strong{display:block}.reading-results td:first-child span{display:block;color:#63758c;margin-top:3px}.reading-help{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:12px 0;color:#63758c}.create-callout{border-left:4px solid #205fce}.create-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.snapshot{margin:0;padding:16px;border-radius:10px;background:#101d2f;color:#e7f0ff;white-space:pre-wrap;overflow-wrap:anywhere
